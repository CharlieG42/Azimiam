plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Signature release : lit android/key.properties s'il existe.
// - Présent (CI avec secrets, ou machine locale) -> APK signé avec la clé release.
// - Absent -> repli sur la clé debug (l'APK reste installable en test).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "wildzimut.azimiam"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "wildzimut.azimiam"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // TODO: (optionnel) activer la minification/R8 pour l'optimisation.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                // Repli : signature debug pour pouvoir installer l'APK quand
                // aucun keystore n'est configuré.
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}
