org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# v0.7.0 : compileSdk 35 (exigé par le plugin health) n'est pas
# testé officiellement avec AGP 8.1 ; cette propriété supprime le simple
# avertissement de compatibilité, le build reste correct.
android.suppressUnsupportedCompileSdk=35
