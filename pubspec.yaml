name: azimiam
description: Azimiam (WildZimut) - Compteur de calories et nutriments par photo de repas.
publish_to: 'none'
version: 0.7.9+25

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  http: ^1.2.0
  image_picker: ^1.1.0
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  # Lecture Health Connect (séances, pas, étages écrits par Garmin
  # Connect). Épinglé exactement : 13.1.3 est la dernière version
  # compatible Dart 3.5.4 (13.1.4+ exige Dart >= 3.8).
  health: 13.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
