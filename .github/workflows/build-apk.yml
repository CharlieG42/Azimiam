name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Analyse + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique (non bloquante, infos non fatals)
        run: flutter analyze --no-fatal-infos

      - name: Tests (bloquants)
        run: flutter test

  apk:
    name: APK signé + Release
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: write
    env:
      # Permet de savoir si les secrets de signature sont configurés.
      AVEC_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Le dépôt stocke les fichiers binaires (wrapper Gradle, icônes) en
      # Base64 (*.b64) : on les redécode en place avant le build.
      - name: Décoder les binaires (.b64)
        run: |
          find . -name '*.b64' -print0 | while IFS= read -r -d '' f; do
            base64 -d "$f" > "${f%.b64}" && rm "$f"
          done
          chmod +x android/gradlew

      - name: Dépendances
        run: flutter pub get

      # Signature : uniquement si les secrets GitHub sont configurés.
      # Sinon, build.gradle replie tout seul sur la clé debug.
      - name: Configurer la signature (secrets)
        if: env.AVEC_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/azimiam-release.p12
          cat > android/key.properties <<PROPS
          storeFile=azimiam-release.p12
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PROPS

      - name: Build APK release
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      # Publication : crée la Release v<version pubspec> et y attache l'APK,
      # ou met à jour la Release existante si le tag existe déjà.
      # Le nom de l'APK termine la version par le numéro de build.
      - name: Publier la Release GitHub
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d '+' -f 1)
          NUM="$GITHUB_RUN_NUMBER"
          TAG="v${VERSION}"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APK_FINAL="azimiam-v${VERSION}-${NUM}.apk"
          cp "$APK" "$APK_FINAL"
          echo "Publication de $TAG -> $APK_FINAL"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FINAL" --clobber
          else
            gh release create "$TAG" "$APK_FINAL" \
              --title "Azimiam $TAG" \
              --notes "APK Android signé ($TAG, build n°${NUM}). Voir le README pour l'installation et la configuration de la clé API Mistral."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: azimiam-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
