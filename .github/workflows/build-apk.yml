name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Analyse + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Le dépôt ne contient que lib/ + test/ + pubspec (méthode Atelier Sprites) :
      # la coque Android est générée à la volée, sans écraser les fichiers existants.
      - name: Générer la coque Android
        run: flutter create --org wildzimut --project-name azimiam --platforms android .

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique (non bloquante, infos non fatals)
        run: flutter analyze --no-fatal-infos

      - name: Tests (bloquants)
        run: flutter test

  apk:
    name: APK release
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer la coque Android
        run: flutter create --org wildzimut --project-name azimiam --platforms android .

      - name: Dépendances
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: azimiam-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
