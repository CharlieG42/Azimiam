name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Analyse + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Épinglé : la coque android/ (AGP 8.1.0) est générée sous 3.24.4 ;
          # un Flutter plus récent la rejette à la configuration Gradle.
          flutter-version: 3.24.4
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique (non bloquante, infos non fatals)
        run: flutter analyze --no-fatal-infos

      - name: Tests (bloquants)
        run: flutter test

  apk:
    name: APK signé + Release
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: write
    env:
      # Permet de savoir si les secrets de signature sont configurés.
      AVEC_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Numéro de la PR quand le run vient d'une pull request (vide sinon) :
      # ajouté à la versionName de l'APK et au nom du fichier APK.
      PR_NUM: ${{ github.event.pull_request.number || '' }}
      # N° de PR lu dans le commit de merge (push sur main) : sert à nommer
      # l'APK publié dans la Release (azimiam-v<version>-<build>-pr<N>.apk).
      MERGE_PR_NUM: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Épinglé : la coque android/ (AGP 8.1.0) est générée sous 3.24.4 ;
          # un Flutter plus récent la rejette à la configuration Gradle.
          flutter-version: 3.24.4
          cache: true

      # Sur un push qui est un merge de PR, on lit le n° de la PR dans le
      # message du commit de merge (ex. "Merge pull request #4 from ...").
      - name: Détecter le n° de PR du merge (push sur main)
        if: github.event_name == 'push'
        run: |
          MERGE_PR=$(git log -1 --pretty=%s | sed -n 's/.*Merge pull request #\([0-9][0-9]*\).*/\1/p')
          echo "MERGE_PR_NUM=$MERGE_PR" >> "$GITHUB_ENV"
          echo "PR du merge : ${MERGE_PR:-aucune}"

      # Le dépôt stocke les fichiers binaires (wrapper Gradle, icônes) en
      # Base64 (*.b64) : on les redécode en place avant le build.
      - name: Décoder les binaires (.b64)
        run: |
          find . -name '*.b64' -print0 | while IFS= read -r -d '' f; do
            base64 -d "$f" > "${f%.b64}" && rm "$f"
          done
          chmod +x android/gradlew

      - name: Dépendances
        run: flutter pub get

      # Signature : uniquement si les secrets GitHub sont configurés.
      # Sinon, build.gradle replie tout seul sur la clé debug.
      - name: Configurer la signature (secrets)
        if: env.AVEC_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/azimiam-release.p12
          cat > android/key.properties <<PROPS
          storeFile=azimiam-release.p12
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PROPS

      # versionCode = n° de build via le pubspec (pas de --build-number sur
      # flutter build apk en 3.24.4). En pull request, le n° de PR est ajouté
      # à la versionName : 0.2.0+2 -> 0.2.0-pr3+42 (versionName affichée = 0.2.0-pr3).
      - name: Version par n° de build (+ n° de PR si pull request)
        run: |
          VERSION_BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d '+' -f 1)
          echo "VERSION_BASE=$VERSION_BASE" >> "$GITHUB_ENV"
          if [ -n "$PR_NUM" ]; then
            sed -i -E "s/^version: .*/version: ${VERSION_BASE}-pr${PR_NUM}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          else
            sed -i -E "s/^version: .*/version: ${VERSION_BASE}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          fi
          grep '^version:' pubspec.yaml
          # Même version embarquée dans l'app (affichée dans « À propos ») :
          printf "/// Version embarquée (regénérée par la CI au build).\nconst String kVersionApp = '%s';\n" "$(grep '^version:' pubspec.yaml | sed 's/version: *//')" > lib/version.dart
          grep 'kVersionApp' lib/version.dart

      - name: Build APK release
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      # Nom de l'APK : azimiam-v<version>-<build>.apk, et
      # azimiam-v<version>-pr<N>-<build>.apk quand le run vient d'une PR.
      - name: Nommer l'APK (version + n° de build + n° de PR)
        run: |
          if [ -n "$PR_NUM" ]; then
            APK_FINAL="azimiam-v${VERSION_BASE}-pr${PR_NUM}-${GITHUB_RUN_NUMBER}.apk"
          elif [ -n "$MERGE_PR_NUM" ]; then
            # push sur main après merge d'une PR : l'APK de la Release porte
            # aussi le n° de la PR fusionnée
            APK_FINAL="azimiam-v${VERSION_BASE}-${GITHUB_RUN_NUMBER}-pr${MERGE_PR_NUM}.apk"
          else
            APK_FINAL="azimiam-v${VERSION_BASE}-${GITHUB_RUN_NUMBER}.apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_FINAL"
          echo "APK_FINAL=$APK_FINAL" >> "$GITHUB_ENV"
          echo "APK produit : $APK_FINAL"

      # En cas d'échec, remonte les dernières lignes du journal en
      # annotations de check (lisibles sans se connecter).
      - name: Diagnostique d'échec
        if: failure()
        run: |
          echo "::error::BUILD-ECHEC dernieres lignes du journal:"
          tail -n 20 build.log | sed 's/^/::error::/' || true

      # Publication : crée la Release v<version pubspec> et y attache l'APK,
      # ou met à jour la Release existante si le tag existe déjà.
      # Le nom de l'APK termine la version par le numéro de build.
      - name: Publier la Release GitHub
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_BASE}"
          NOTES="APK Android signé ($TAG, build n°${GITHUB_RUN_NUMBER})."
          if [ -n "$MERGE_PR_NUM" ]; then
            NOTES="$NOTES Fusion de la PR #${MERGE_PR_NUM}."
          fi
          NOTES="$NOTES Voir le README pour l'installation et la configuration de la clé API Mistral."
          echo "Publication de $TAG -> $APK_FINAL"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FINAL" --clobber
          else
            gh release create "$TAG" "$APK_FINAL" \
              --title "Azimiam $TAG" \
              --notes "$NOTES"
          fi

      # Nettoyage de la Release : on ne garde que l'APK de la dernière
      # génération (celui qui vient d'être publié) ; tous les autres assets
      # azimiam-*.apk sont supprimés pour éviter d'installer un build périmé.
      - name: Nettoyer la Release (dernier build uniquement)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_BASE}"
          REL_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || true)
          if [ -z "$REL_ID" ]; then
            echo "Release ${TAG} introuvable : aucun nettoyage."
            exit 0
          fi
          echo "Release ${TAG} (id ${REL_ID}) : on ne garde que ${APK_FINAL}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets?per_page=100" \
            --paginate --jq '.[] | "\(.id)\t\(.name)"' |
          while IFS=$'\t' read -r id nom; do
            case "$nom" in
              azimiam-*.apk)
                if [ "$nom" != "$APK_FINAL" ]; then
                  echo "  suppression de l'ancien APK : ${nom} (id ${id})"
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" || true
                fi
                ;;
            esac
          done || true
          echo "Assets restants dans la Release :"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets?per_page=100" --jq '.[].name' || true

      - uses: actions/upload-artifact@v4
        with:
          name: azimiam-release-apk
          path: ${{ env.APK_FINAL }}
